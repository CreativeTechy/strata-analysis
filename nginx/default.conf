upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # The two document-upload routes (POST .../projects/{id}/documents and
    # POST .../competitor/studies/{id}/documents - see
    # project_documents_api.py / competitor_api.py) are multipart and can
    # carry up to MAX_FILES_PER_UPLOAD (currently 20) files, each up to
    # DOCUMENT_MAX_FILE_SIZE_MB (config.py, currently 100MB) - well past the
    # server-level 100m default. A regex location, matched before the plain
    # /api/ prefix below, raises the cap for just these two paths rather than
    # for every /api/ route (login included) - an unauthenticated client
    # should not be able to make the proxy buffer gigabytes before the
    # backend ever gets to reject the request on auth. Every directive here
    # is duplicated from /api/ below (locations don't inherit from a sibling
    # prefix match) - keep the two in sync, and keep the size here in step
    # with DOCUMENT_MAX_FILE_SIZE_MB * MAX_FILES_PER_UPLOAD if either changes.
    location ~ ^/api/(projects/\d+/documents|competitor/studies/\d+/documents)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 2100m;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
