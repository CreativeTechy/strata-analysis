upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # client_max_body_size bounds the whole request, not any one file in
        # it - a document upload is multipart and can carry up to
        # MAX_FILES_PER_UPLOAD (project_documents_store.py, currently 20)
        # files, each up to DOCUMENT_MAX_FILE_SIZE_MB (config.py, currently
        # 100MB). The server-level 100m above is well under a single
        # near-cap file plus multipart overhead, let alone a multi-file
        # batch, so raise it here to what the backend itself already allows
        # (with headroom for multipart boundaries/headers) rather than
        # rejecting at the proxy before the backend's own per-file check - and
        # its actual error message - ever runs. Keep this in step with
        # DOCUMENT_MAX_FILE_SIZE_MB * MAX_FILES_PER_UPLOAD if either changes.
        client_max_body_size 2100m;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
