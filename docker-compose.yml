services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      args:
        VITE_SPIDER_URL: ${VITE_SPIDER_URL:-}
        VITE_API_TARGET: ${VITE_API_TARGET:-}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
