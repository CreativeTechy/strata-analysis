services:
  db:
    image: postgres:16
    # POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD live in backend/.env, the same
    # file the backend reads them from - backend/db.py builds its connection
    # string out of them - so the credentials are defined in one place. Postgres
    # ignores the rest of that file.
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  adminer:
    image: adminer:4
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The local LLM every AI feature runs against by default. Set
  # OLLAMA_CHAT_BASE_URL=http://ollama:11434/v1/chat/completions in
  # backend/.env to route the backend here - "ollama" is this service's name,
  # resolvable from the backend container over the Docker network, unlike
  # backend/.env's own localhost default (which would resolve to the backend
  # container itself). Point OLLAMA_CHAT_BASE_URL at a remote tunnel (e.g.
  # ngrok in front of Ollama on another machine) to use that instead.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pulls OLLAMA_CHAT_MODEL (backend/.env, default llama3.1) into
  # the `ollama-data` volume once the server is healthy, then exits. Re-run
  # via `docker compose up ollama-pull` after changing the model -
  # already-pulled models are a no-op.
  ollama-pull:
    image: ollama/ollama:latest
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_CHAT_MODEL:-llama3.1}\""]
    restart: "no"

  frontend:
    build:
      context: ./dashboard
      args:
        VITE_API_TARGET: ${VITE_API_TARGET:-}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8210:80"
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
  ollama-data:
