services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  adminer:
    image: adminer:4
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - ollama
    environment:
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b-instruct}
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./dashboard
      args:
        VITE_SPIDER_URL: ${VITE_SPIDER_URL:-}
        VITE_API_TARGET: ${VITE_API_TARGET:-}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8210:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
